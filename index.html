<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Prototype styles -->
  <link rel="stylesheet" href="/styles/index.css" />
  <link rel="stylesheet" href="/styles/slds2_agentic.css" />
  <link rel="stylesheet" href="/styles/gc.css" />
  
<link rel="stylesheet" href="/styles/promo.css" />

</head>
<body>

  
  <script>
    (function () {
      try {
        if (window.self !== window.top) {
          document.body.setAttribute('data-embedded', 'salesforce');
        }
      } catch (e) {
        // Cross-origin frame access can throw; that's ALSO a signal we're embedded.
        document.body.setAttribute('data-embedded', 'salesforce');
      }
    })();
  </script>

  <header class="slds-global-header_container">
      <a href="javascript:void(0);" class="slds-assistive-text slds-assistive-text_focus">Skip to Navigation</a>
      <a href="javascript:void(0);" class="slds-assistive-text slds-assistive-text_focus">Skip to Main Content</a>
      <div class="slds-global-header slds-grid slds-grid_align-spread">
        <div class="slds-global-header__item">
          <div class="slds-global-header__logo">
            <img src="/assets/images/logo-noname.svg" style= "width: 12.5rem;height: 2.5rem;background-size: contain;background-repeat: no-repeat;background-position: left center;"alt="Salesforce Logo" />
          </div>
        </div>
        
        <div class="slds-global-header__item slds-global-header__item_search slds-subtheme-agentic app-global-search">
          <div class="slds-form-element app-global-search__input">
            <label class="slds-form-element__label slds-assistive-text" for="app-global-search-input">Search or ask anything</label>
            <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left">
              <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_left" aria-hidden="true">
                <svg class="slds-icon slds-icon-text-default slds-icon_x-small" aria-hidden="true">
                  <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#search"></use>
                </svg>
              </span>
              <input
                type="search"
                id="app-global-search-input"
                class="slds-input"
                placeholder="Search or ask anything..."
                aria-label="Search or ask anything"
                autocomplete="off"
              />
            </div>
          </div>

          <button type="button" class="slds-button slds-button_neutral app-global-search__ask">
            <svg class="slds-button__icon slds-button__icon_left" aria-hidden="true">
              <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#sparkles"></use>
            </svg>
            <span>Ask</span>
          </button>
        </div>
        
        <div class="slds-global-header__item">
          <ul class="slds-global-actions">
            <li class="slds-global-actions__item">
              <div class="slds-global-actions__favorites slds-dropdown-trigger slds-dropdown-trigger_click">
                <div class="slds-button-group">
                  <button class="slds-button slds-button_icon slds-global-actions__favorites-action slds-button_icon slds-button_icon-border slds-button_icon-small" aria-pressed="false" title="Toggle Favorites">
                    <svg class="slds-button__icon" aria-hidden="true">
                      <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#favorite"></use>
                    </svg>
                    <span class="slds-assistive-text">Toggle Favorite</span>
                  </button>
                  <button class="slds-button slds-button_icon slds-global-actions__favorites-more slds-button_icon slds-button_icon-border slds-button_icon-small" title="View Favorites">
                    <svg class="slds-button__icon" aria-hidden="true" style="height:12px;width:12px;">
                      <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#down"></use>
                    </svg>
                    <span class="slds-assistive-text">View Favorites</span>
                  </button>
                </div>
              </div>
            </li>
            <li class="slds-global-actions__item">
              <div class="slds-dropdown-trigger slds-dropdown-trigger_click">
                <button class="slds-button slds-button_icon slds-button_icon slds-button_icon-container slds-button_icon-small slds-global-actions__task slds-global-actions__item-action" aria-haspopup="true" title="Global Actions">
                  <svg class="slds-button__icon" aria-hidden="true" style="fill:white;">
                    <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#add"></use>
                  </svg>
                  <span class="slds-assistive-text">Global Actions</span>
                </button>
              </div>
            </li>
            <li class="slds-global-actions__item">
              <div class="slds-dropdown-trigger slds-dropdown-trigger_click">
                <button class="slds-button slds-button_icon slds-button_icon slds-button_icon-container slds-button_icon-small slds-global-actions__help slds-global-actions__item-action" aria-haspopup="true" title="Help and Training">
                  <svg class="slds-button__icon slds-global-header__icon" aria-hidden="true">
                    <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#question"></use>
                  </svg>
                  <span class="slds-assistive-text">Help and Training</span>
                </button>
              </div>
            </li>
            <li class="slds-global-actions__item">
              <div class="slds-dropdown-trigger slds-dropdown-trigger_click">
                <button class="slds-button slds-button_icon slds-button_icon slds-button_icon-container slds-button_icon-small slds-global-actions__setup slds-global-actions__item-action" aria-haspopup="true" title="Setup">
                  <svg class="slds-button__icon slds-global-header__icon" aria-hidden="true">
                    <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#setup"></use>
                  </svg>
                  <span class="slds-assistive-text">Setup</span>
                </button>
              </div>
            </li>
            <li class="slds-global-actions__item">
              <div class="slds-dropdown-trigger slds-dropdown-trigger_click">
                <button class="slds-button slds-button_icon slds-button_icon slds-button_icon-container slds-button_icon-small slds-global-actions__notifications slds-global-actions__item-action" title="no new notifications" aria-live="assertive" aria-atomic="true">
                  <svg class="slds-button__icon slds-global-header__icon" aria-hidden="true">
                    <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#notification"></use>
                  </svg>
                  <span class="slds-assistive-text">no new notifications</span>
                </button>
                <span aria-hidden="true" class="slds-notification-badge">0</span>
              </div>
            </li>
            <li class="slds-global-actions__item">
              <div class="slds-dropdown-trigger slds-dropdown-trigger_click">
                <button class="slds-button slds-global-actions__avatar slds-global-actions__item-action" title="person name" aria-haspopup="true">
                  <span class="slds-avatar slds-avatar_circle slds-avatar_medium">
                    <img alt="Person name" src="/assets/images/user-avatar.png" title="User avatar" />
                  </span>
                </button>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </header>



 
  <div class="app-header-placeholder"></div>


  <div style="height: 16rem;">
      <div class="slds-context-bar" style="padding-left: 0px;">
        <div class="slds-context-bar__primary">
          <div class="slds-context-bar__item slds-context-bar__dropdown-trigger slds-dropdown-trigger slds-dropdown-trigger_click slds-no-hover">
            <div class="slds-context-bar__icon-action">
              <button class="slds-button slds-icon-waffle_container slds-context-bar__button" title="Description of the icon when needed">
                <span class="slds-icon-waffle">
                  <span class="slds-r1"></span>
                  <span class="slds-r2"></span>
                  <span class="slds-r3"></span>
                  <span class="slds-r4"></span>
                  <span class="slds-r5"></span>
                  <span class="slds-r6"></span>
                  <span class="slds-r7"></span>
                  <span class="slds-r8"></span>
                  <span class="slds-r9"></span>
                </span>
                <span class="slds-assistive-text">Open App Launcher</span>
              </button>
            </div>
            <span class="slds-context-bar__label-action slds-context-bar__app-name">
              <span class="slds-truncate" title="App Name">Sales</span>
            </span>
          </div>
        </div>
        <nav class="slds-context-bar__secondary" role="navigation">
          <ul class="slds-grid">
            
            <li class="slds-context-bar__item">
              <a href="/home.html" class="slds-context-bar__label-action" title="Home">
                <span class="slds-assistive-text">Current Page:</span>
                <span class="slds-truncate" title="Home">Home</span>
              </a>
            </li>

            
            <li class="slds-context-bar__item">
              <a href="/prospect_list.html" class="slds-context-bar__label-action" title="Prospecting">
                <span class="slds-truncate" title="Prospecting">Prospecting</span>
              </a>
            </li>
            <li class="slds-context-bar__item slds-is-active">
              <a href="/index.html" class="slds-context-bar__label-action" title="Agent Builder">
                <span class="slds-truncate" title="Agent Builder">Agent Builder</span>
              </a>
            </li>
            <li class="slds-context-bar__item">
              <a href="javascript:void(0);" class="slds-context-bar__label-action" title="Menu Item">
                <span class="slds-truncate" title="Menu Item">Leads</span>
              </a>
            </li>
            <li class="slds-context-bar__item">
              <a href="javascript:void(0);" class="slds-context-bar__label-action" title="Menu Item">
                <span class="slds-truncate" title="Menu Item">Accounts</span>
              </a>
            </li>

            
            <li class="slds-context-bar__item">
              <a href="/agent_monitoring.html" class="slds-context-bar__label-action" title="Agent Monitoring">
                <span class="slds-truncate" title="Agent Monitoring">Agent Monitoring</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>

  <main class="app-wrapper slds-template_default">
    

<div class="promo-page-container">
  <div class="slds-grid slds-grid_vertical slds-grid_vertical-align-center">
      <div class="slds-col promo-title slds-m-bottom_small">Meet Hunter</div>
      <div class="slds-col promo-description slds-m-bottom_large">Hunter finds target accounts, researches buyers, and engages prospects on your behalf.</div>
      <div class="slds-grid slds-m-bottom_x-large">
        
        <button class="slds-button slds-button_brand" style="height:40px" onclick="sessionStorage.removeItem('aop_previewed_step1');sessionStorage.removeItem('aop_previewed_step2');sessionStorage.removeItem('aop_previewed_step3');sessionStorage.removeItem('aop_previewed_step4');sessionStorage.removeItem('aop_previewed_step5');sessionStorage.removeItem('aop_previewed_step6');sessionStorage.removeItem('aop-tabs-account_research');sessionStorage.removeItem('aop-tabs-find_prospects');sessionStorage.removeItem('aop-tabs-write_messaging');sessionStorage.removeItem('aop-tabs-full_preview');sessionStorage.removeItem('zoominfo_connected');window.location.href='/hunter_getting_started.html'">
          Build Hunter
          <svg class="slds-button__icon slds-button__icon_right" aria-hidden="true">
            <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#forward"></use>
          </svg>
        </button>
        <button class="slds-button slds-button_neutral" style="height:40px;margin-left:8px" onclick="sessionStorage.removeItem('aop_previewed_step1');sessionStorage.removeItem('aop_previewed_step2');sessionStorage.removeItem('aop_previewed_step3');sessionStorage.removeItem('aop_previewed_step4');sessionStorage.removeItem('aop_previewed_step5');sessionStorage.removeItem('aop_previewed_step6');sessionStorage.removeItem('aop-tabs-account_research');sessionStorage.removeItem('aop-tabs-find_prospects');sessionStorage.removeItem('aop-tabs-write_messaging');sessionStorage.removeItem('aop-tabs-full_preview');sessionStorage.removeItem('zoominfo_connected');window.location.href='/getting_started.html'">
          Guided Config
          <svg class="slds-button__icon slds-button__icon_right" aria-hidden="true">
            <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#forward"></use>
          </svg>
        </button>
        <!-- <button class="slds-button slds-button_base">Contact Your Admin</button> -->
      </div>  
  </div>
  <div class="promo-carousel">
    <div class="promo-tab-bar slds-grid">
      
      <div class="slds-col slds-p-horizontal_x-small" data-tab="0" data-description="Every prospect comes with a clear explanation on why timing is right and personalized messaging queued up in your sequencing tool.">
        <button class="promo-tab-button is-active" data-text="Priority List">Priority List</button>
        <div class="promo-tab-prog"></div>
      </div>
      
      <div class="slds-col slds-p-horizontal_x-small" data-tab="1" data-description="Agent learns to prospect like your best reps, then scales your entire sales team with consistent outbound.">
        <button class="promo-tab-button" data-text="Deep Research">Deep Research</button>
        <div class="promo-tab-prog"></div>
      </div>
      
      <div class="slds-col slds-p-horizontal_x-small" data-tab="2" data-description="Every prospect comes with a clear explanation on why timing is right and personalized messaging queued up in your sequencing tool.">
        <button class="promo-tab-button" data-text="Rank Prospects">Rank Prospects</button>
        <div class="promo-tab-prog"></div>
      </div>
      
      <div class="slds-col slds-p-horizontal_x-small" data-tab="3" data-description="Monitor agent performance with real-time dashboards, logs, and quality metrics.">
        <button class="promo-tab-button" data-text="Observability">Observability</button>
        <div class="promo-tab-prog"></div>
      </div>
      
      <div class="slds-col slds-p-horizontal_x-small" data-tab="4" data-description="Give your agent the skills and tools to complete their job.">
        <button class="promo-tab-button" data-text="Tools">Tools</button>
        <div class="promo-tab-prog"></div>
      </div>
      
    </div>
    <div class="promo-gallery">
      
      <div class="promo-gallery__panel is-visible" data-panel="0">
        <img src="/assets/images/promo/prospect-list.png" alt="Priority List" />
      </div>
      
      <div class="promo-gallery__panel" data-panel="1">
        <img src="/assets/images/promo/deep-research.png" alt="Deep Research" />
      </div>
      
      <div class="promo-gallery__panel" data-panel="2">
        <img src="/assets/images/promo/find-prospects.png" alt="Rank Prospects" />
      </div>
      
      <div class="promo-gallery__panel" data-panel="3">
        <img src="/assets/images/promo/observability.png" alt="Observability" />
      </div>
      
      <div class="promo-gallery__panel" data-panel="4">
        <img src="/assets/images/promo/agent-actions.png" alt="Tools" />
      </div>
      
    </div>
  </div>
</div>

    });
